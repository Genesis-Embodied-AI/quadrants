name: api docs build

on:
  workflow_call:
    inputs:
      head_ref:
        description: 'The head ref (branch name or PR ref)'
        required: true
        type: string
      artifact_name:
        description: 'Name of the artifact to download'
        required: true
        type: string
  workflow_dispatch:
concurrency:
  group: gh-pages-deploy-${{ github.event.inputs.head_ref || github.head_ref }}
  cancel-in-progress: true
permissions:
  contents: write
  statuses: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: manylinux install wheel
        run: |
          set -x
          mkdir -p dist
          mv *.whl dist/
          ls -lh dist/
          pip install dist/*.whl
          pip install --group docs
          python -c 'import quadrants as qd; qd.init(arch=qd.cpu); print(qd.__version__)'
          pip freeze | grep sphinx
      - name: Build docs
        run: |
          cd docs
          make html
      - name: Mark branch preview
        if: github.head_ref != ''
        run: touch docs/build/html/.preview
      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          # Keep branch names such as user_guide separate from permanent documentation directories.
          destination_dir: ${{ github.head_ref && format('preview/{0}', github.head_ref) || '' }}
          keep_files: true
          publish_branch: gh-pages
      - name: Link to documentation preview
        if: github.head_ref != ''
        env:
          PREVIEW_BRANCH: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from urllib.parse import quote

          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/")
          branch = quote(os.environ["PREVIEW_BRANCH"], safe="/")
          url = f"https://{owner}.github.io/{repo}/preview/{branch}/"
          # Attach the link to the PR head, rather than GitHub's temporary merge commit.
          subprocess.run([
              "gh", "api", "--method", "POST",
              f"repos/{owner}/{repo}/statuses/{os.environ['PR_HEAD_SHA']}",
              "-f", "state=success", "-f", "context=Docs preview",
              "-f", "description=Open docs preview (publishing may take a few minutes)",
              "-f", f"target_url={url}",
          ], check=True)
          PY
