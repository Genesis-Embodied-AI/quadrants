name: Clean up documentation previews

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report expired previews without deleting them
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # Share the publisher's lock so cleanup cannot race a preview deployment.
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Remove previews older than seven days
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          if [ "$DRY_RUN" != "true" ]; then args+=(--apply); fi
          python tooling/python/tools/cleanup_doc_previews.py \
            --site site --repository "$GITHUB_REPOSITORY" "${args[@]}"
      - name: Publish cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: site
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove documentation previews older than seven days'
          git push origin HEAD:gh-pages
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
