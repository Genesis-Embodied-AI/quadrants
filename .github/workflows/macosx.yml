name: Mac Vulkan archived-binary attribution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Archived Vulkan A/B (${{ matrix.order }})
    runs-on: macos-26
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        order: [old-new, new-old]
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: dd3e0850998cbcced148bda94afa145013075d0f
          path: old
      - uses: actions/checkout@v4
        with:
          ref: aa2fd7c30e5f0cd174c8e8b45e0bed05d3515546
          path: new
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: mac_wheel_26_cp310
          run-id: 32883911509
          github-token: ${{ github.token }}
          path: wheels-old
      - uses: actions/download-artifact@v4
        with:
          name: mac_wheel_26_cp310
          run-id: 37518349285
          github-token: ${{ github.token }}
          path: wheels-new
      - name: Compare archived wheels on identical unchanged tests
        env:
          AB_ORDER: ${{ matrix.order }}
        run: |
          python control/.github/workflows/scripts_new/macosx/attribution_ab.py \
            --old old --new new --old-wheels wheels-old --new-wheels wheels-new \
            --order "$AB_ORDER" --work "$HOME/ais/misc_slow_vulkan/ab"
      - name: Upload complete logs, common test manifest and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-attribution-${{ matrix.order }}
          path: ~/ais/misc_slow_vulkan/ab/output/
