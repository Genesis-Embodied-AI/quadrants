name: Mac Vulkan archived attribution
on:
  workflow_dispatch:
    inputs:
      comparison:
        description: Shared-test binaries, common/full October workloads, or complete historical snapshots
        type: choice
        options:
          - binary
          - import-batch
          - import-batch-census
          - runtime-growth
          - kernel-registry
          - kernel-lifetime
          - gc-native
          - gc-walk
          - gc-order
          - gc-cpu
          - simt-only
          - python-gc
          - expanded-binary
          - workload
          - snapshots
          - gc-profile
          - dataclass-ablation
          - pydantic
          - process-batches
          - process-batches-candidate
          - production-batches-candidate
          - owner-guard
          - owner-guard-candidate
          - gc-freeze-candidate
        default: binary
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Archived Vulkan A/B (${{ matrix.order }})
    runs-on: macos-26
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        order: >-
          ${{ fromJSON(inputs.comparison == 'python-gc' && '["synthetic"]' ||
          inputs.comparison == 'simt-only' && '["simt"]' ||
          inputs.comparison == 'gc-cpu' && '["cpu"]' ||
          inputs.comparison == 'gc-order' && '["growth"]' ||
          inputs.comparison == 'gc-walk' && '["growth"]' ||
          inputs.comparison == 'gc-native' && '["growth"]' ||
          inputs.comparison == 'kernel-lifetime' && '["strong-weak"]' ||
          inputs.comparison == 'kernel-registry' && '["weak-strong","strong-weak"]' ||
          inputs.comparison == 'runtime-growth' && '["growth"]' ||
          startsWith(inputs.comparison, 'import-batch') && '["small-all","all-small"]' ||
          inputs.comparison == 'production-batches-candidate' && '["batched"]' ||
          inputs.comparison == 'process-batches-candidate' && '["batched"]' ||
          inputs.comparison == 'gc-freeze-candidate' && '["frozen"]' ||
          inputs.comparison == 'owner-guard-candidate' && '["guarded"]' ||
          inputs.comparison == 'owner-guard' && '["guarded-full","full-guarded"]' ||
          inputs.comparison == 'process-batches' && '["batched-full","full-batched"]' ||
          inputs.comparison == 'dataclass-ablation' && '["pruned-full","full-pruned"]' ||
          inputs.comparison == 'gc-profile' && '["new"]' || inputs.comparison == 'workload' &&
          '["common-full","full-common"]' || '["old-new","new-old"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: dd3e0850998cbcced148bda94afa145013075d0f
          path: old
      - uses: actions/checkout@v4
        with:
          ref: aa2fd7c30e5f0cd174c8e8b45e0bed05d3515546
          path: new
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: mac_wheel_26_cp310
          run-id: 32883911509
          github-token: ${{ github.token }}
          path: wheels-old
      - uses: actions/download-artifact@v4
        with:
          name: mac_wheel_26_cp310
          run-id: 37518349285
          github-token: ${{ github.token }}
          path: wheels-new
      - name: Download completed full-suite coverage reference
        if: endsWith(inputs.comparison, '-candidate') || startsWith(inputs.comparison, 'kernel-')
        uses: actions/download-artifact@v4
        with:
          name: vulkan-attribution-full-pruned
          run-id: 38180133761
          github-token: ${{ github.token }}
          path: reference
      - name: Run controlled comparison
        env:
          AB_ORDER: ${{ matrix.order }}
          AB_COMPARISON: ${{ inputs.comparison || 'binary' }}
        run: |
          pinned=()
          if [[ "$AB_COMPARISON" != binary ]]; then
            pinned=(--requirements control/.github/workflows/scripts_new/macosx/october_2026_requirements.txt)
          fi
          if [[ "$AB_COMPARISON" == *-candidate || "$AB_COMPARISON" == kernel-* ]]; then
            pinned+=(--reference reference)
          fi
          python control/.github/workflows/scripts_new/macosx/attribution_ab.py \
            --old old --new new --old-wheels wheels-old --new-wheels wheels-new \
            --comparison "$AB_COMPARISON" --order "$AB_ORDER" --work "$HOME/ais/misc_slow_vulkan/ab" "${pinned[@]}"
      - name: Upload complete logs, common test manifest and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-attribution-${{ matrix.order }}
          path: ~/ais/misc_slow_vulkan/ab/output/
