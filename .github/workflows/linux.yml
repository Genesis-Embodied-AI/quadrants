name: Linux
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Developing directly on ubuntu arm not supported currently.
        # Need to dev inside a manylinux container, when developing using linux arm.
        OS: ['ubuntu-22.04']
    name: Linux ${{ matrix.OS }} Build
    runs-on: ${{ matrix.OS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Linux prerequisites
        run: |
          bash .github/workflows/scripts_new/linux/1_prerequisites.sh
      - name: Linux build
        run: |
          bash .github/workflows/scripts_new/linux/2_build.sh
      - name: Linux install
        run: |
          bash .github/workflows/scripts_new/linux/3_install.sh
      - name: Linux test
        run: |
          bash .github/workflows/scripts_new/linux/4_test.sh
      - name: Collect CPU coverage
        if: always()
        run: |
          python tests/coverage_report.py --collect-only
      - name: Upload wheel for CUDA job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheel
          path: dist/*.whl
      - name: Upload CPU coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cpu
          path: |
            coverage.xml
            pytest-coverage.txt

  test-cuda:
    name: Linux CUDA Test
    needs: build
    runs-on: gpu-t4-4-core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install CUDA libraries
        run: |
          sudo apt-get install -y libcusolver-dev-12-8 libcusolver-12-8 libcusparse-dev-12-8 libcusparse-12-8 libnvjitlink-12-8 libcublas-12-8
          echo "/usr/local/cuda/targets/x86_64-linux/lib" | sudo tee /etc/ld.so.conf.d/cuda-targets.conf
          sudo ldconfig
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-wheel
      - name: Install quadrants
        run: |
          set -x
          mkdir -p dist
          mv *.whl dist/
          pip install dist/*.whl
      - name: Install test requirements
        run: |
          pip install --group test
      - name: Run CUDA tests
        run: |
          bash .github/workflows/scripts_new/linux/4_test_cuda.sh
      - name: Collect CUDA coverage
        if: always()
        run: |
          python tests/coverage_report.py --collect-only
      - name: Upload CUDA coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cuda
          path: coverage.xml

  coverage-report:
    if: github.event_name == 'pull_request' && always()
    needs: [build, test-cuda]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Download CPU coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-cpu
          path: coverage-cpu
      - name: Download CUDA coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-cuda
          path: coverage-cuda
      - name: Generate coverage reports
        id: generate_coverage
        continue-on-error: true
        run: |
          COV_XMLS=""
          if [ -f coverage-cpu/coverage.xml ]; then
            COV_XMLS="coverage-cpu/coverage.xml"
          fi
          if [ -f coverage-cuda/coverage.xml ]; then
            COV_XMLS="$COV_XMLS coverage-cuda/coverage.xml"
          fi
          if [ -z "$COV_XMLS" ]; then
            echo "unavailable=true" >> "$GITHUB_OUTPUT"
            echo "No coverage XML files found, skipping report"
            exit 0
          fi

          HEAD_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-9)

          state=success
          for report in check summary; do
            format=markdown
            if [ "$report" = summary ]; then
              format=markdown-summary
            fi
            exit_code=0
            python tests/coverage_report.py --report-only \
              --compare-branch=origin/${{ github.base_ref }} \
              --coverage-xml $COV_XMLS \
              --commit-hash "$HEAD_SHA" \
              --format "$format" > "coverage-$report.md" || exit_code=$?
            # Exit 42 means the report succeeded but coverage is below 80%.
            if [ "$exit_code" -eq 42 ]; then
              state=failure
            elif [ "$exit_code" -ne 0 ]; then
              exit "$exit_code"
            fi
          done
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Prepare coverage status
        id: coverage_status
        if: always()
        env:
          COVERAGE_UNAVAILABLE: ${{ steps.generate_coverage.outputs.unavailable }}
          GENERATION_OUTCOME: ${{ steps.generate_coverage.outcome }}
          COVERAGE_STATE: ${{ steps.generate_coverage.outputs.state }}
        run: |
          message=""
          if [ "$COVERAGE_UNAVAILABLE" = true ]; then
            message="Coverage unavailable"
          elif [ "$GENERATION_OUTCOME" != success ] || [ ! -s coverage-check.md ] || [ ! -s coverage-summary.md ]; then
            message="Coverage report generation failed"
          fi
          if [ -n "$message" ]; then
            printf '%s\n' "$message" | tee coverage-check.md > coverage-summary.md
            echo "state=error" >> "$GITHUB_OUTPUT"
          else
            echo "state=$COVERAGE_STATE" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload full coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-check.md
      - name: Write coverage report to job summary
        if: always()
        run: |
          # Job summaries allow up to 1 MiB; leave room for the truncation notice.
          MAX_BYTES=900000
          if [ "$(wc -c < coverage-check.md)" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" coverage-check.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n\n---\n*Report truncated. Download the full report from the workflow artifacts.*\n' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            cat coverage-check.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish coverage status
        if: always()
        uses: actions/github-script@v8
        env:
          REPORT_STATE: ${{ steps.coverage_status.outputs.state || 'error' }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('coverage-summary.md', 'utf8').trim();
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: process.env.REPORT_STATE,
              context: '_Artifact: Diff coverage',
              // GitHub limits commit status descriptions to 140 characters.
              description: summary.substring(0, 140),
              target_url: process.env.REPORT_URL
            });
