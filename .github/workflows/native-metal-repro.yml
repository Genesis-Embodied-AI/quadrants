name: Standalone Metal resource crash controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native Metal mode ${{ matrix.mode }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone Metal executable
        run: |
          mkdir -p native-output
          sw_vers > native-output/environment.txt
          xcrun clang++ --version >> native-output/environment.txt
          xcrun clang++ -std=c++17 -O2 -g -fobjc-arc -Wall -Wextra -Werror \
            -framework Foundation -framework Metal \
            .github/workflows/scripts_new/macosx/native_metal_repro.mm -o native-output/repro
          shasum -a 256 native-output/repro > native-output/sha256.txt
      - name: Run three independent native processes
        env:
          PROBE_MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          root = pathlib.Path('native-output')
          started = time.monotonic()
          processes, logs = [], []
          for i in range(3):
              stream = (root / f'worker-{i}.txt').open('w')
              logs.append(stream)
              processes.append(subprocess.Popen([str(root / 'repro'), os.environ['PROBE_MODE'], '1500'],
                                                stdout=stream, stderr=subprocess.STDOUT))
          codes = [p.wait() for p in processes]
          for stream in logs:
              stream.close()
          result = dict(mode=int(os.environ['PROBE_MODE']), cycles_per_worker=1500,
                        seconds=time.monotonic()-started, returncodes=codes)
          (root / 'results.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result))
          for path in sorted(root.glob('worker-*.txt')):
              print(path, path.read_text())
          raise SystemExit(any(codes))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-metal-mode-${{ matrix.mode }}
          path: native-output/
