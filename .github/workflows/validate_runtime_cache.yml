name: Validate AMD runtime cache
on:
  push:
    branches: [hp/validate-amd-runtime-cache]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: ${{ contains(github.event.head_commit.message, '[rebuild]') }}
    runs-on: ubuntu-22.04
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build wheel and C++ tests
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          task_root="$HOME/ais/misc_slow_amd/build-${GITHUB_RUN_ID}"
          mkdir -p "$task_root/tmp"
          export TMPDIR="$task_root/tmp"
          export XDG_CACHE_HOME="$task_root/cache"
          /opt/python/cp310-cp310/bin/python -m venv "$task_root/venv"
          export PATH="$task_root/venv/bin:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.https://gitlab.com.helper '!f() { if [ "$1" = get ] && [ -n "$GITLAB_PAT" ]; then printf "%s\n" "username=oauth2" "password=$GITLAB_PAT"; fi; }; f'
          bash .github/workflows/scripts_new/manylinux_wheel/1_prerequisites.sh 2>&1 | tee build-prerequisites.log
          bash .github/workflows/scripts_new/manylinux_wheel/2_build.sh 2>&1 | tee build.log
          bash .github/workflows/scripts_new/manylinux_wheel/3_check.sh 2>&1 | tee wheel-check.log
          build/quadrants_cpp_tests --gtest_filter='RuntimeHsacoCache.*' 2>&1 | tee cpp-cache.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-build
          path: |
            wheelhouse/*.whl
            build/quadrants_cpp_tests
            *.log
  test:
    if: ${{ always() && !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amdgpu
            runner: misc-slow-amd-probe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      QD_AMDGPU_V520: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: cache-build
          run-id: ${{ needs.build.result == 'success' && github.run_id || '40941781497' }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Set up isolated environment
        shell: bash
        run: |
          set -euo pipefail
          task_root="$HOME/ais/misc_slow_amd/cache-${GITHUB_RUN_ID}-${{ matrix.arch }}"
          mkdir -p "$task_root/tmp" "$task_root/results"
          echo "TASK_ROOT=$task_root" >> "$GITHUB_ENV"
          echo "TMPDIR=$task_root/tmp" >> "$GITHUB_ENV"
          echo "QD_TMP_DIR=$task_root/tmp" >> "$GITHUB_ENV"
          uv venv --python '3.10' --seed "$task_root/venv"
          echo "$task_root/venv/bin" >> "$GITHUB_PATH"
          uv pip install --python "$task_root/venv/bin/python" artifacts/wheelhouse/*.whl --group test
          { lscpu; free -h; uptime; } | tee "$task_root/results/hardware.txt"
          sha256sum artifacts/wheelhouse/*.whl | tee "$task_root/results/wheel-sha256.txt"
      - uses: actions/download-artifact@v4
        with:
          name: manylinux_wheel_cp310_ubuntu-22.04
          run-id: '40896217880'
          github-token: ${{ github.token }}
          path: baseline
      - name: Compare pre-PR wheel and isolate allocation test
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/misc:${PYTHONPATH:-}"
          export PYTEST_ADDOPTS="-p no:faulthandler -p amd_crash_probe"
          export AMD_CRASH_CACHE=on
          for wheel in current-off current baseline; do
            if [ "$wheel" = baseline ]; then
              uv pip install --python "$TASK_ROOT/venv/bin/python" --reinstall baseline/*.whl || exit 1
              sha256sum baseline/*.whl > "$TASK_ROOT/results/baseline-sha256.txt"
            fi
            export AMD_CRASH_CACHE=on
            if [ "$wheel" = current-off ]; then export AMD_CRASH_CACHE=off; fi
            for files in 'field' 'fail_device_memory_allocation field'; do
              export AMD_CRASH_RESULTS="$TASK_ROOT/results/$wheel-${files// /-}"
              mkdir -p "$AMD_CRASH_RESULTS"
              timeout --kill-after=10s 120s python tests/run_tests.py $files --arch amdgpu -r 0 -t 1 -v -k 'huge_allocation or default_fp or default_ip or field_name or (test_field_copy_from and dtype0-shape0)' 2>&1 | tee "$AMD_CRASH_RESULTS/pytest.log"
              echo "${PIPESTATUS[0]}" > "$AMD_CRASH_RESULTS/exit-status.txt"
            done
            export AMD_CRASH_RESULTS="$TASK_ROOT/results/gdb-$wheel"
            mkdir -p "$AMD_CRASH_RESULTS"
            if command -v gdb; then
              timeout --kill-after=10s 120s gdb -batch -ex 'set pagination off' -ex 'set print thread-events off' -ex run -ex 'bt 40' --args python tests/run_tests.py fail_device_memory_allocation field --arch amdgpu -r 0 -t 1 -v -s -k 'huge_allocation or default_fp or default_ip or field_name or (test_field_copy_from and dtype0-shape0)' > "$AMD_CRASH_RESULTS/gdb.log" 2>&1
            fi
          done
      - name: Kernel diagnostics
        if: always()
        run: |
          sudo -n journalctl -k --since '2026-10-29 20:00:00 UTC' --no-pager > "$TASK_ROOT/results/kernel.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-crash-baseline
          path: ${{ env.TASK_ROOT }}/results
