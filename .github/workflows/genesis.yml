name: Genesis

# Genesis is the main consumer of Quadrants, and its test suite and benchmarks exercise the compiler far beyond what
# the tests of this repository cover. This workflow runs the CI of Genesis itself, called as a reusable workflow.
on:
  workflow_run:
    workflows: ["Manylinux wheel build"]
    types: [completed]

# Pull requests come from forks, whose branch names collide across contributors, so the repository they live in is
# part of what tells two runs apart.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}
    ${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      genesis_sha: ${{ steps.prepare.outputs.genesis_sha }}
      image_version: ${{ steps.prepare.outputs.image_version }}
      constraints: ${{ steps.prepare.outputs.constraints }}
      wheel_run: ${{ steps.prepare.outputs.wheel_run }}
      wheel_artifact: ${{ steps.prepare.outputs.wheel_artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'wandb<0.25'
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/genesis_benchmarks.py prepare
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.snapshot_exists != 'true'
        with:
          name: benchmark-input
          path: benchmark-results/manifest.json
          if-no-files-found: error

  tests-and-benchmarks:
    name: genesis-tests_and_benchmarks
    needs: prepare

    # Only a pull request is worth checking, Genesis being validated before a change lands rather than after.
    # 'completed' is the one terminal activity type of 'workflow_run', fired for every conclusion, so the conclusion
    # is read here: a wheel workflow that failed or was cancelled by a newer revision built nothing worth testing.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "neutral"]'), github.event.workflow_run.conclusion)

    permissions:
      contents: read
      # To download the wheel from the triggering run.
      actions: read
      # To check the pull request behind the triggering run.
      pull-requests: read

    # The CI of Genesis runs on the runners of the Genesis repository, made available to this one through their
    # runner group. The calls of all the repositories other than Genesis share a single one of these runners, taking it
    # in turn, oldest first, which requires the secrets passed on below.
    uses: Genesis-Embodied-AI/genesis-world/.github/workflows/production.yml@main
    with:
      quadrants_run_id: ${{ fromJSON(needs.prepare.outputs.wheel_run) }}
      quadrants_artifact_id: ${{ fromJSON(needs.prepare.outputs.wheel_artifact) }}
      benchmark_sha: ${{ needs.prepare.outputs.genesis_sha }}
      benchmark_image_ver: ${{ needs.prepare.outputs.image_version }}
      benchmark_constraints: ${{ needs.prepare.outputs.constraints }}
      # Only the minimal set of tests Genesis requires to pass on any environment, in the dynamic array mode alone:
      # the full matrix belongs to the CI of Genesis.
      unit_tests_markexpr: required and not slow
      unit_tests_modes: '["1"]'
    secrets: inherit

  # A 'workflow_run' job is not attached to the pull request that started it. Publish a commit status so its outcome
  # can be required before merging, without creating a standalone check that GitHub may group under another workflow.
  publish-check:
    name: genesis-publish_check

    needs: tests-and-benchmarks
    if: always() && needs.tests-and-benchmarks.result != 'skipped'
    runs-on: ubuntu-latest

    permissions:
      statuses: write

    steps:
      - name: Publish PR status
        uses: actions/github-script@v8
        env:
          CHECK_NAME: Genesis Unit Tests & Benchmarks
          RESULT: ${{ needs.tests-and-benchmarks.result }}
          IS_SKIPPED: ${{ needs.tests-and-benchmarks.outputs.is_skipped }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const isSuccess = process.env.RESULT === 'success';
            const isSkipped = isSuccess && process.env.IS_SKIPPED === 'true';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              context: process.env.CHECK_NAME,
              state: isSuccess ? 'success' : 'failure',
              target_url: process.env.RUN_URL,
              description: isSkipped
                ? 'PR closed before its wheel was built; tests skipped.'
                : isSuccess
                ? 'The Genesis unit tests and benchmarks pass with the wheel under test.'
                : `Genesis unit tests or benchmarks failed (${process.env.RESULT}).`,
            });

  benchmark-comparison:
    name: genesis-benchmark_comparison
    needs: [prepare, tests-and-benchmarks]
    if: needs.tests-and-benchmarks.outputs.is_skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Genesis-Embodied-AI/genesis-world
          path: genesis-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'wandb<0.25' frozendict
      - name: Mark comparison pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.payload.workflow_run.head_sha,
              context: '_Artifact: Benchmark Comparison', state: 'pending',
              description: 'Publishing measurements and selecting a matching main baseline.',
            });
      - name: Restore this run's configuration
        run: python .github/scripts/genesis_benchmarks.py prepare
      - name: Publish measurements and reconcile merge
        run: python .github/scripts/genesis_benchmarks.py publish
      - name: Compare with eligible main baseline
        run: python .github/scripts/genesis_benchmarks.py compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-comparison-tables
          overwrite: true
          path: |
            benchmark-*.csv
            benchmark-report.md
      - name: Report comparison infrastructure failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.payload.workflow_run.head_sha,
              context: '_Artifact: Benchmark Comparison', state: 'failure',
              description: 'Benchmark comparison unavailable. See the workflow log.',
            });
